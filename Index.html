<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular Idade</title>
</head>
<body>
    <h1>Verificador de Idade</h1>

    <label for="idade">Digite sua idade:</label>
    <input type="number" id="idade" min="0" placeholder="Ex: 18">
    <button type="button" onclick="calcularIdade()">Calcular</button>

    <p id="resultado"></p>

    <script>
        console.log("Essa é uma mensagem de console."); // --- imprime algo que você tenha no código ---

        function calcularIdade() {
            let idade = Number(document.getElementById("idade").value);
            let textoResultado = document.getElementById("resultado");

            if (idade >= 18) {
                console.log("Sua idade é: " + idade);
                console.log("maior de idade");
                textoResultado.textContent = "Sua idade é: " + idade + " — Maior de idade";
            } else {
                console.log("Sua idade é: " + idade);
                console.log("menor de idade");
                textoResultado.textContent = "Sua idade é: " + idade + " — Menor de idade";
            }
        }
    </script>
</body>
</html>
